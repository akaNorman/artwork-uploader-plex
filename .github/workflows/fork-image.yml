name: Fork image

# Fork (ranked mode): every push to the ranked-mode branch runs the tests, then builds the Docker
# image and publishes it as ghcr.io/<owner>/artwork-uploader:ranked, which the Unraid container
# pulls. A failing test suite stops the image from being published.

on:
  push:
    branches: [ranked-mode]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: fork-image
  cancel-in-progress: true

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # amd64 only: that is what the Unraid server runs, and it keeps the build quick.
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository_owner }}/artwork-uploader:ranked
            ghcr.io/${{ github.repository_owner }}/artwork-uploader:ranked-${{ github.sha }}
